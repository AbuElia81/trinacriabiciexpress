<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trinacria Bici Express — Geführte Radtouren in Sizilien</title>
<meta name="description" content="Geführte Radwochen in Sizilien mit Giacomo und Michael. Vier Stunden Rad am Tag, der Rest ist Essen, Barock und Insiderwissen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   TRINACRIA BICI EXPRESS
   Kalkstein (Noto), Tinte (Reisetagebuch 1808), Feigenkaktus, Zitrone.
----------------------------------------------------------------*/
:root{
  --stone:#EFEAE0; --stone-2:#E2DACA;
  --ink:#10303B; --ink-2:#1D4A55;
  --sea:#2E7E8C; --fico:#C0326B; --limone:#E7B23A;
  --line:rgba(16,48,59,.18);
  --display:"Fraunces",Georgia,serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --wrap:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--stone);color:var(--ink);font-family:var(--body);
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea);margin:0 0 14px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.05;margin:0}
h2{font-size:clamp(30px,4vw,46px);letter-spacing:-.01em}
h3{font-size:22px}
p{margin:0 0 16px}
section{padding:96px 0;border-top:1px solid var(--line)}

/* Kopf */
header{position:sticky;top:0;z-index:50;background:rgba(239,234,224,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:66px}
.mark{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.1em;
  text-decoration:none;white-space:nowrap}
.mark span{color:var(--fico)}
@media(max-width:520px){.mark{font-size:13px;letter-spacing:.05em}}
nav{margin-left:auto;display:flex;gap:24px;align-items:center}
nav a{font-size:15px;text-decoration:none;color:var(--ink-2)}
nav a:hover{color:var(--fico)}
.btn-s{background:var(--ink);color:var(--stone)!important;padding:9px 16px;border-radius:2px;font-weight:500}
.btn-s:hover{background:var(--fico)}
@media(max-width:900px){nav a:not(.btn-s){display:none}}

/* Sprachumschalter */
.langs{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.langs button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;cursor:pointer;
  background:transparent;border:0;color:var(--sea);padding:7px 9px;transition:.2s}
.langs button + button{border-left:1px solid var(--line)}
.langs button:hover{background:rgba(46,126,140,.1)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--stone)}
.langs button:focus-visible{outline:2px solid var(--fico);outline-offset:-2px}

/* Hero */
.hero{padding:64px 0 40px;border-top:none}
.hero-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:56px;align-items:center}
@media(max-width:960px){.hero-grid{grid-template-columns:1fr;gap:32px}}
.hero h1{font-size:clamp(42px,6.2vw,74px);letter-spacing:-.02em}
.hero h1 em{font-style:italic;color:var(--fico)}
.lede{font-size:20px;max-width:40ch;color:var(--ink-2)}
.facts{display:flex;margin:28px 0 30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact{flex:1;padding:14px 0}
.fact + .fact{border-left:1px solid var(--line);padding-left:18px}
.fact b{display:block;font-family:var(--mono);font-size:19px}
.fact small{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sea)}
.btn{display:inline-block;background:var(--fico);color:#fff;text-decoration:none;
  padding:15px 28px;border-radius:2px;font-weight:600}
.btn:hover{background:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);margin-left:10px}
.btn.ghost:hover{background:var(--ink);color:var(--stone)}

/* Karte */
.map-card{position:relative;background:linear-gradient(180deg,#F6F2E9,#E7E0D2);
  border:1px solid var(--line);padding:10px}
.map-cap{position:absolute;right:14px;bottom:10px;font-family:var(--mono);font-size:11px;color:var(--sea)}
svg .coast{fill:#E8E1D1;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
svg .hatch{fill:url(#hatch);opacity:.5}
svg .route{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:7 6;opacity:.18;transition:opacity .5s,stroke-width .5s}
svg .route.on{opacity:1;stroke-width:3.2;animation:draw 2.4s linear infinite}
@keyframes draw{to{stroke-dashoffset:-52}}
#rA{stroke:var(--fico)} #rB{stroke:var(--sea)}
svg .dot{fill:var(--stone);stroke:var(--ink);stroke-width:1.3;opacity:.25;transition:opacity .4s}
svg .dot.on{opacity:1;stroke-width:1.6}
svg .lbl{font-family:var(--mono);font-size:10.5px;fill:var(--ink);opacity:0;transition:opacity .4s}
svg .lbl.on{opacity:.85}
svg .etna{fill:none;stroke:var(--ink);stroke-width:1;opacity:.5}

/* Routen */
.switch{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 40px}
.switch button{font-family:var(--body);font-size:15px;font-weight:500;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--ink-2);
  padding:12px 20px;border-radius:2px;transition:.2s;text-align:left}
.switch button:hover{border-color:var(--ink)}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--stone);border-color:var(--ink)}
.switch button:focus-visible{outline:2px solid var(--fico);outline-offset:2px}
.route-head{display:grid;grid-template-columns:1.4fr 1fr;gap:48px;margin-bottom:44px}
@media(max-width:860px){.route-head{grid-template-columns:1fr;gap:20px}}
.route-head p{color:var(--ink-2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);height:fit-content}
.stats div{background:var(--stone);padding:16px 18px}
.stats b{display:block;font-family:var(--mono);font-size:18px}
.stats small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}

/* Etappen */
.ledger{border-top:1px solid var(--ink)}
.day{display:grid;grid-template-columns:74px 1fr 160px 120px;gap:24px;align-items:baseline;
  padding:22px 0;border-bottom:1px solid var(--line)}
.day:hover{background:rgba(46,126,140,.05)}
.day .n{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--sea);text-transform:uppercase}
.day .t{font-family:var(--display);font-size:21px;font-weight:600}
.day .t small{display:block;font-family:var(--body);font-size:15px;font-weight:400;
  color:var(--ink-2);margin-top:4px;line-height:1.5}
.day .km{font-family:var(--mono);font-size:14px;color:var(--sea)}
.day .hm{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
@media(max-width:760px){.day{grid-template-columns:56px 1fr;gap:12px}
  .day .km,.day .hm{grid-column:2;font-size:13px}}

/* Preis */
.dark{background:var(--ink);color:var(--stone);border-top:none}
.dark .tag{color:var(--limone)}
.dark h2{color:var(--stone)}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px}
@media(max-width:860px){.price-grid{grid-template-columns:1fr;gap:36px}}
.price{font-family:var(--display);font-size:88px;font-weight:900;line-height:1;letter-spacing:-.03em}
.price sup{font-size:28px;font-weight:600;vertical-align:top;margin-left:4px}
.price-sub{font-family:var(--mono);font-size:13px;color:var(--limone);letter-spacing:.08em;text-transform:uppercase}
.price-note{max-width:34ch;color:rgba(239,234,224,.8)}
.price-fine{max-width:34ch;color:rgba(239,234,224,.8);font-size:15px}
ul.incl{list-style:none;margin:0;padding:0}
ul.incl li{padding:12px 0;border-bottom:1px solid rgba(239,234,224,.16);display:flex;gap:14px}
ul.incl li::before{content:"—";color:var(--limone);font-family:var(--mono)}
.excl{margin-top:22px;font-size:14px;color:rgba(239,234,224,.65)}

/* Guides */
.portrait{margin:36px 0 0;padding:0}
.portrait img{width:100%;aspect-ratio:16/7;object-fit:cover;object-position:center 38%;
  border:1px solid var(--line)}
.portrait figcaption{font-family:var(--mono);font-size:12px;color:var(--sea);margin-top:10px}
@media(max-width:760px){.portrait img{aspect-ratio:4/3}}
.guides{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:44px}
@media(max-width:860px){.guides{grid-template-columns:1fr;gap:36px}}
.guide h3{margin:0 0 4px}
.guide .role{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--fico);margin-bottom:12px}

/* Bilder */
.slot{background:repeating-linear-gradient(45deg,var(--stone-2),var(--stone-2) 12px,#E9E2D3 12px,#E9E2D3 24px);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  padding:20px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-2);
  line-height:1.5;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:cover}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:44px}
.gallery .slot{aspect-ratio:1/1}
.gallery .slot:first-child{grid-column:span 2;aspect-ratio:2/1}
@media(max-width:760px){.gallery{grid-template-columns:1fr}.gallery .slot:first-child{grid-column:span 1}}

/* Buchen */
.book{display:grid;grid-template-columns:1fr 1fr;gap:64px}
@media(max-width:860px){.book{grid-template-columns:1fr;gap:36px}}
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--sea);margin:0 0 6px}
input,select,textarea{width:100%;font-family:var(--body);font-size:16px;color:var(--ink);
  background:#F6F2E9;border:1px solid var(--line);border-radius:2px;padding:12px 14px;margin-bottom:18px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--fico);outline-offset:1px;border-color:transparent}
.hint{font-size:13px;color:var(--ink-2);margin-top:14px}

footer{background:var(--ink);color:rgba(239,234,224,.75);padding:64px 0 40px;font-size:14px}
footer a{color:var(--limone)}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px}
@media(max-width:760px){.foot-grid{grid-template-columns:1fr;gap:28px}}
footer h4{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--limone);margin:0 0 12px;font-weight:500}
.note{margin-top:48px;padding-top:24px;border-top:1px solid rgba(239,234,224,.16);
  font-size:12.5px;color:rgba(239,234,224,.5)}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="mark" href="#">TRINACRIA<span> BICI </span>EXPRESS</a>
    <nav>
      <a href="#routen" data-i="nav.routes"></a>
      <a href="#preis" data-i="nav.price"></a>
      <a href="#guides" data-i="nav.guides"></a>
      <a href="#fotos" data-i="nav.photos"></a>
      <div class="langs" role="group" aria-label="Sprache / Language / Lingua">
        <button data-lang="de" aria-pressed="true">DE</button>
        <button data-lang="en" aria-pressed="false">EN</button>
        <button data-lang="it" aria-pressed="false">IT</button>
      </div>
      <a href="#buchen" class="btn-s" data-i="nav.cta"></a>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="wrap hero-grid">
    <div>
      <p class="tag" data-i="hero.tag"></p>
      <h1><span data-i="hero.h1a"></span><br><em data-i="hero.h1b"></em></h1>
      <p class="lede" data-i="hero.lede"></p>
      <div class="facts">
        <div class="fact"><b>1 290 €</b><small data-i="hero.f1"></small></div>
        <div class="fact"><b data-i="hero.f2b"></b><small data-i="hero.f2"></small></div>
        <div class="fact"><b>2</b><small data-i="hero.f3"></small></div>
      </div>
      <a href="#buchen" class="btn" data-i="btn.book"></a>
      <a href="#routen" class="btn ghost" data-i="btn.routes"></a>
    </div>

    <div class="map-card">
      <svg viewBox="0 0 880 570" role="img" aria-label="Sicilia">
        <defs>
          <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#10303B" stroke-width=".5" opacity=".35"/>
          </pattern>
        </defs>
        <path class="coast" d="M 58 106 L 87 235 L 74 300 L 112 386 L 227 411 L 326 448 L 418 461 L 510 502 L 649 534 L 720 549 L 758 480 L 743 421 L 760 359 L 806 275 L 828 163 L 750 121 L 622 158 L 439 194 L 264 130 L 148 165 L 110 51 Z"/>
        <path class="hatch" d="M 58 106 L 87 235 L 74 300 L 112 386 L 227 411 L 326 448 L 418 461 L 510 502 L 649 534 L 720 549 L 758 480 L 743 421 L 760 359 L 806 275 L 828 163 L 750 121 L 622 158 L 439 194 L 264 130 L 148 165 L 110 51 Z"/>
        <path class="etna" d="M 690 320 l 22 -34 l 22 34 M 700 306 l 12 -8 l 12 8"/>
        <text class="lbl on" x="678" y="352" style="opacity:.5">Etna 3357</text>

        <polyline id="rA" class="route on"
          points="710,375 611,352 565,323 547,326 535,329 461,313 405,274 375,248 344,222 270,183"/>
        <polyline id="rB" class="route"
          points="705,373 762,318 705,373 718,421 731,468 675,439 634,414 616,437 634,391 675,352 705,373"/>

        <g id="pA">
          <circle class="dot on" cx="710" cy="375" r="4.5"/><text class="lbl on" x="720" y="379">Catania</text>
          <circle class="dot on" cx="611" cy="352" r="3.5"/><text class="lbl on" x="576" y="343">Catenanuova</text>
          <circle class="dot on" cx="565" cy="323" r="3.5"/><text class="lbl on" x="556" y="314">Agira</text>
          <circle class="dot on" cx="535" cy="329" r="3.5"/><text class="lbl on" x="496" y="345">Leonforte</text>
          <circle class="dot on" cx="461" cy="313" r="3.5"/><text class="lbl on" x="428" y="304">Alimena</text>
          <circle class="dot on" cx="405" cy="274" r="3.5"/><text class="lbl on" x="352" y="266">Caltavuturo</text>
          <circle class="dot on" cx="344" cy="222" r="3.5"/><text class="lbl on" x="304" y="214">Termini</text>
          <circle class="dot on" cx="270" cy="183" r="5"/><text class="lbl on" x="222" y="174">PALERMO</text>
        </g>
        <g id="pB">
          <circle class="dot" cx="762" cy="318" r="4"/><text class="lbl" x="772" y="322">Siracusa</text>
          <circle class="dot" cx="705" cy="373" r="5"/><text class="lbl" x="714" y="368">NOTO</text>
          <circle class="dot" cx="731" cy="468" r="3.5"/><text class="lbl" x="740" y="472">Portopalo</text>
          <circle class="dot" cx="675" cy="439" r="3.5"/><text class="lbl" x="628" y="455">Ispica</text>
          <circle class="dot" cx="634" cy="414" r="3.5"/><text class="lbl" x="586" y="410">Modica</text>
          <circle class="dot" cx="616" cy="437" r="3.5"/><text class="lbl" x="568" y="447">Scicli</text>
          <circle class="dot" cx="634" cy="391" r="3.5"/><text class="lbl" x="580" y="386">Ragusa</text>
          <circle class="dot" cx="675" cy="352" r="3.5"/><text class="lbl" x="620" y="345">Palazzolo</text>
        </g>
      </svg>
      <span class="map-cap" data-i="map.cap"></span>
    </div>
  </div>
</section>

<!-- ROUTEN -->
<section id="routen">
  <div class="wrap">
    <p class="tag" data-i="routes.tag"></p>
    <h2 style="max-width:16ch;margin-bottom:34px" data-i="routes.h2"></h2>

    <div class="switch" role="group">
      <button id="bA" aria-pressed="true" data-i="routes.btnA"></button>
      <button id="bB" aria-pressed="false" data-i="routes.btnB"></button>
    </div>

    <div class="route-head">
      <div>
        <h3 id="rTitle" style="margin-bottom:12px"></h3>
        <p id="rText"></p>
      </div>
      <div class="stats">
        <div><b id="sKm"></b><small data-i="stats.km"></small></div>
        <div><b id="sHm"></b><small data-i="stats.hm"></small></div>
        <div><b id="sDays"></b><small data-i="stats.days"></small></div>
        <div><b id="sLevel"></b><small data-i="stats.level"></small></div>
      </div>
    </div>

    <div class="ledger" id="ledger"></div>
  </div>
</section>

<!-- PREIS -->
<section id="preis" class="dark">
  <div class="wrap price-grid">
    <div>
      <p class="tag" data-i="price.tag"></p>
      <div class="price">1 290<sup>€</sup></div>
      <p class="price-sub" data-i="price.sub"></p>
      <p class="price-note" style="margin-top:26px" data-i="price.note"></p>
      <p class="price-fine" data-i="price.fine"></p>
      <a href="#buchen" class="btn" style="background:var(--limone);color:var(--ink)" data-i="price.cta"></a>
    </div>
    <div>
      <ul class="incl">
        <li data-i="incl.1"></li>
        <li data-i="incl.2"></li>
        <li data-i="incl.3"></li>
        <li data-i="incl.4"></li>
        <li data-i="incl.5"></li>
        <li data-i="incl.6"></li>
        <li data-i="incl.7"></li>
      </ul>
      <p class="excl" data-i="excl"></p>
    </div>
  </div>
</section>

<!-- GUIDES -->
<section id="guides">
  <div class="wrap">
    <p class="tag" data-i="guides.tag"></p>
    <h2 style="max-width:20ch" data-i="guides.h2"></h2>

    <figure class="portrait">
      <img src="fotos/guides-meer.jpg" alt="Giacomo &amp; Michael">
      <figcaption data-i="guides.cap"></figcaption>
    </figure>

    <div class="guides">
      <div class="guide">
        <h3>Giacomo</h3>
        <p class="role" data-i="guides.role1"></p>
        <p data-i="guides.bio1"></p>
      </div>
      <div class="guide">
        <h3>Michael</h3>
        <p class="role" data-i="guides.role2"></p>
        <p data-i="guides.bio2"></p>
      </div>
    </div>
  </div>
</section>

<!-- FOTOS -->
<section id="fotos">
  <div class="wrap">
    <p class="tag" data-i="photos.tag"></p>
    <h2 style="max-width:18ch" data-i="photos.h2"></h2>
    <div class="gallery">
      <div class="slot"><img src="fotos/guides-mauer.jpg" alt="Giacomo &amp; Michael" style="object-position:center 30%"></div>
      <div class="slot" data-foto="fotos/noto.jpg" data-i="photos.s1"></div>
      <div class="slot" data-foto="fotos/ortigia.jpg" data-i="photos.s2"></div>
      <div class="slot" data-foto="fotos/modica.jpg" data-i="photos.s3"></div>
      <div class="slot" data-foto="fotos/tisch.jpg" data-i="photos.s4"></div>
      <div class="slot" data-foto="fotos/madonie.jpg" data-i="photos.s5"></div>
    </div>
  </div>
</section>

<!-- BUCHEN -->
<section id="buchen">
  <div class="wrap book">
    <div>
      <p class="tag" data-i="book.tag"></p>
      <h2 style="max-width:14ch;margin-bottom:20px" data-i="book.h2"></h2>
      <p data-i="book.p"></p>
      <p class="hint" data-i="book.season"></p>
    </div>

    <form id="form" novalidate>
      <label for="n" data-i="form.name"></label>
      <input id="n" name="name" required>

      <label for="e" data-i="form.mail"></label>
      <input id="e" name="email" type="email" required>

      <label for="r" data-i="form.route"></label>
      <select id="r" name="route">
        <option data-i="form.optA"></option>
        <option data-i="form.optB"></option>
        <option data-i="form.optC"></option>
      </select>

      <label for="d" data-i="form.date"></label>
      <input id="d" name="datum" type="date">

      <label for="p" data-i="form.people"></label>
      <select id="p" name="personen"><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option></select>

      <label for="lg" data-i="form.lang"></label>
      <select id="lg" name="sprache"><option>Deutsch</option><option>English</option><option>Italiano</option></select>

/* =====================  LOGIK  ===================== */
const $=s=>document.querySelector(s);
const SUPPORTED=["de","en","it"];
let lang="de", route="A";

function pickLang(){
  const q=new URLSearchParams(location.search).get("lang");
  if(SUPPORTED.includes(q)) return q;
  const b=(navigator.language||"de").slice(0,2).toLowerCase();
  return SUPPORTED.includes(b)?b:"de";
}

function paintText(){
  document.querySelectorAll("[data-i]").forEach(el=>{
    const v=I18N[lang][el.dataset.i];
    if(v!==undefined) el.textContent=v;
  });
  document.documentElement.lang=lang;
  document.querySelectorAll(".langs button").forEach(b=>
    b.setAttribute("aria-pressed", b.dataset.lang===lang));
}

function paintRoute(){
  const r=ROUTES[lang][route];
  $("#rTitle").textContent=r.title;
  $("#rText").textContent=r.text;
  $("#sKm").textContent=r.km; $("#sHm").textContent=r.hm;
  $("#sDays").textContent=r.days; $("#sLevel").textContent=r.level;

  $("#ledger").innerHTML=r.list.map(d=>`
    <div class="day">
      <div class="n">${d[0]}</div>
      <div class="t">${d[1]}<small>${d[2]}</small></div>
      <div class="km">${d[3]}</div>
      <div class="hm">${d[4]}</div>
    </div>`).join("");

  $("#bA").setAttribute("aria-pressed", route==="A");
  $("#bB").setAttribute("aria-pressed", route==="B");
  $("#rA").classList.toggle("on", route==="A");
  $("#rB").classList.toggle("on", route==="B");
  document.querySelectorAll("#pA .dot, #pA .lbl").forEach(e=>e.classList.toggle("on", route==="A"));
  document.querySelectorAll("#pB .dot, #pB .lbl").forEach(e=>e.classList.toggle("on", route==="B"));
}

function setLang(l){
  lang=l;
  paintText(); paintRoute();
  const u=new URL(location); u.searchParams.set("lang",l);
  history.replaceState(null,"",u);           // Sprache bleibt im Link erhalten
}

document.querySelectorAll(".langs button").forEach(b=>
  b.addEventListener("click",()=>setLang(b.dataset.lang)));
$("#bA").addEventListener("click",()=>{route="A";paintRoute()});
$("#bB").addEventListener("click",()=>{route="B";paintRoute()});

/* Fotos: Platzhalter durch echte Datei ersetzen, sobald vorhanden */
document.querySelectorAll(".slot[data-foto]").forEach(slot=>{
  const probe=new Image();
  probe.onload=()=>{slot.textContent="";slot.removeAttribute("data-i");slot.appendChild(probe)};
  probe.src=slot.dataset.foto; probe.alt="";
});

/* Formular — später an Formspree o. Ä. hängen */
$("#form").addEventListener("submit",e=>{
  e.preventDefault();
  $("#ok").hidden=false;
  e.target.reset();
});

$("#y").textContent=new Date().getFullYear();
setLang(pickLang());
</script>
